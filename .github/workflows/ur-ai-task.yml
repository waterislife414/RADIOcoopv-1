name: ur-ai-task
# Push a branch named ur-go/<T1..T6> and this runs Aider (free models) on that task from AI_PROMPT.md,
# then pushes the result to branch ur/<task>. Needs repo secrets GEMINI_API_KEY, OPENROUTER_API_KEY, GROQ_API_KEY.
on:
  push:
    branches: ['ur-go/**']
  workflow_dispatch:
    inputs:
      task: { description: 'Task id, e.g. T1', required: true }
run-name: ai ${{ inputs.task || github.ref_name }}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: { ref: unclaimed-recovery, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install aider-chat -r requirements.txt
      - name: Run task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BR: ${{ github.ref_name }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          T="${INPUT_TASK:-${BR#ur-go/}}"
          MODEL=gemini/gemini-2.5-flash
          git config user.name "ai-bot"; git config user.email "ai-bot@users.noreply.github.com"
          git checkout -b "ur/$T"
          { cat docs/ai/style-$(echo $MODEL|cut -d/ -f1).txt; cat AGENTS.md; echo; echo "TASK:"; grep -E "^$T " AI_PROMPT.md; echo "Rules: small diff; touch only the named FILES; synthetic fixtures only; no keys, no network."; } > /tmp/task.txt
          for ATTEMPT in 1 2; do
          for M in gemini/gemini-3.5-flash-lite openrouter/cohere/north-mini-code:free openrouter/google/gemma-4-31b-it:free groq/llama-3.3-70b-versatile "$MODEL"; do
            echo "trying $M" >> /tmp/models.txt
            timeout 230 aider --yes-always --no-check-update --model "$M" --map-tokens 8192 --read AGENTS.md --read docs/ai/KNOWLEDGE.md --read docs/ai/lessons.md --lint-cmd "python: ruff check" --auto-lint --test-cmd "pytest -q" --auto-test $(for r in $(grep -E "^$T " AI_PROMPT.md | sed -n "s/.*READ: //p"); do echo --read $r; done) --message-file /tmp/task.txt $(grep -E "^$T " AI_PROMPT.md | sed -n "s/.*FILES: \([^R]*\).*/\1/p" | sed -E 's/\.? *$//') 2>&1 | tee /tmp/aider.log || true
            RC=${PIPESTATUS[0]}
            [ "$RC" = "124" ] || grep -qiE "rate.?limit|NotFoundError|quota|RESOURCE_EXHAUSTED|is unavailable|overloaded" /tmp/aider.log || break
            sleep 40
          done
            [ "$(git diff --name-only origin/unclaimed-recovery -- uprec tests | wc -l)" != "0" ] && break
            echo "NUDGE: no code change after attempt $ATTEMPT" >> /tmp/models.txt
            printf "\nYOU MADE NO CODE CHANGE LAST TIME. The task requires creating or editing the named FILES. Read them, then make the edit now. Do not ask questions.\n" >> /tmp/task.txt
          done
          mkdir -p docs/ai; tail -40 /tmp/aider.log > "docs/ai/log-$T.txt"
          ruff check . > /tmp/lint.txt 2>&1 && L=pass || L=FAIL
          pytest -q > /tmp/unit.txt 2>&1 && U=pass || U=FAIL
          CH=$(git diff --name-only origin/unclaimed-recovery -- uprec tests | wc -l)
          printf "task %s\ncode_files_changed %s\nlint %s\ntests %s\n" "$T" $CH $L $U > "docs/ai/report-$T.txt"
          git add -A && git commit -qm "AI task $T (lint $L, tests $U)" || true
          git push -f origin "ur/$T"
