name: ai-task
# Push a branch named ai-go/<T2|T3|T4|T5|T6> and this runs Aider (free Gemini) on that task from AI_PROMPT.md,
# then pushes the result to branch ai/<task>. Needs repo secret GEMINI_API_KEY.
on:
  push:
    branches: ['ai-go/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: step1-wip, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install aider-chat && npm ci && (cd functions && npm ci)
      - name: Run task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BR: ${{ github.ref_name }}
        run: |
          T="${BR#ai-go/}"
          git config user.name "ai-bot"; git config user.email "ai-bot@users.noreply.github.com"
          git checkout -b "ai/$T"
          { cat AGENTS.md; echo; echo "TASK:"; grep -E "^$T " AI_PROMPT.md; echo "Rules: small diff; touch only needed files; no keys/deploys/money logic."; } > /tmp/task.txt
          aider --yes-always --no-check-update --model gemini/gemini-2.5-flash --message-file /tmp/task.txt || true
          npx oxlint src functions > /tmp/lint.txt 2>&1 || true
          node --test functions/lib/*.test.mjs > /tmp/unit.txt 2>&1 && U=pass || U=FAIL
          npm run build > /tmp/build.txt 2>&1 && B=pass || B=FAIL
          npm run build:demo > /tmp/demo.txt 2>&1 && D=pass || D=FAIL
          mkdir -p docs/ai && printf "task %s\nunit %s\nbuild %s\nbuild:demo %s\n" "$T" $U $B $D > "docs/ai/report-$T.txt"
          git add -A && git commit -qm "AI task $T (unit $U, build $B, demo $D)" || true
          git push origin "ai/$T"
