name: ai-task
# Push a branch named ai-go/<T2|T3|T4|T5|T6> and this runs Aider (free Gemini) on that task from AI_PROMPT.md,
# then pushes the result to branch ai/<task>. Needs repo secret GEMINI_API_KEY.
on:
  push:
    branches: ['ai-go/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: step1-wip, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install aider-chat && npm ci && (cd functions && npm ci)
      - name: Playwright for QA tasks
        if: endsWith(github.ref_name, 'T7')
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Run task
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BR: ${{ github.ref_name }}
        run: |
          T="${BR#ai-go/}"
          TESTCMD="npm run build:demo"; [ "$T" = T7 ] && TESTCMD="bash tests/qa/run.sh"; MODEL=gemini/gemini-2.5-flash; [ "$T" = T6 ] && MODEL=openrouter/cohere/north-mini-code:free
          git config user.name "ai-bot"; git config user.email "ai-bot@users.noreply.github.com"
          git checkout -b "ai/$T"
          { cat docs/ai/style-$(echo $MODEL|cut -d/ -f1).txt; cat AGENTS.md; echo; echo "TASK:"; grep -E "^$T " AI_PROMPT.md; echo "Rules: small diff; touch only needed files; no keys/deploys/money logic."; } > /tmp/task.txt
          for M in gemini/gemini-3.5-flash-lite openrouter/cohere/north-mini-code:free openrouter/google/gemma-4-31b-it:free groq/llama-3.3-70b-versatile "$MODEL"; do
            echo "trying $M" >> /tmp/models.txt
            aider --yes-always --no-check-update --model "$M" --map-tokens 8192 --read AGENTS.md --read docs/ai/KNOWLEDGE.md --read docs/ai/lessons.md --lint-cmd "javascript: npx oxlint" --auto-lint --test-cmd "$TESTCMD" --auto-test --read docs/CHANGES-AND-TODO.md --read docs/HANDOVER.md --read branding.config.json --read firestore.rules $(for r in $(grep -E "^$T " AI_PROMPT.md | sed -n "s/.*READ: //p"); do echo --read $r; done) --message-file /tmp/task.txt $(grep -E "^$T " AI_PROMPT.md | sed -n "s/.*FILES: \([^R]*\).*/\1/p") > /tmp/aider.log 2>&1 || true
            grep -qiE "rate.?limit|NotFoundError|quota|RESOURCE_EXHAUSTED|is unavailable|overloaded" /tmp/aider.log || break
            sleep 40
          done
          mkdir -p docs/ai; tail -40 /tmp/aider.log > "docs/ai/log-$T.txt"
          npx oxlint src functions > /tmp/lint.txt 2>&1 || true
          node --test functions/lib/*.test.mjs > /tmp/unit.txt 2>&1 && U=pass || U=FAIL
          npm run build > /tmp/build.txt 2>&1 && B=pass || B=FAIL
          npm run build:demo > /tmp/demo.txt 2>&1 && D=pass || D=FAIL
          mkdir -p docs/ai && CH=$(git diff --name-only origin/step1-wip -- src tests functions | wc -l); printf "task %s\ncode_files_changed %s\nunit %s\nbuild %s\nbuild:demo %s\n" "$T" $CH $U $B $D > "docs/ai/report-$T.txt"
          git add -A && git commit -qm "AI task $T (unit $U, build $B, demo $D)" || true
          git push -f origin "ai/$T"
