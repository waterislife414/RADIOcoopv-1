name: ai-review
# Push branch ai-review/<task>: a DIFFERENT model than the author reviews ai/<task>, attacks the diff, fixes problems, re-runs checks.
on:
  push:
    branches: ['ai-review/**']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install aider-chat -r requirements.txt
      - name: Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BR: ${{ github.ref_name }}
        run: |
          T="${BR#ai-review/}"
          git config user.name "ai-reviewer"; git config user.email "ai-bot@users.noreply.github.com"
          git checkout -B "ai/$T" "origin/ai/$T"
          MODEL=gemini/gemini-3.5-flash-lite
          git diff origin/main --stat -- . ':!docs' ':!.gitignore' | awk '{print $1}' | grep -E '^(uprec|tests)/' > /tmp/files.txt || true
          { cat AGENTS.md; echo; echo "You are the REVIEWER, not the author. Another AI made this change for task: $(grep -E "^$T " AI_PROMPT.md)"; echo "Attack it: wrong column names vs db/schema.sql, thresholds hard-coded instead of read from config/rules.yaml, off-by-one on cents and dates, missing edge cases, real-looking personal data, anything outside the task. Fix real problems with minimal edits; if nothing is wrong change nothing. End by listing each issue found and fixed."; } > /tmp/review.txt
          for M in "$MODEL" openrouter/cohere/north-mini-code:free openrouter/google/gemma-4-31b-it:free groq/llama-3.3-70b-versatile; do
            echo "trying $M" >> /tmp/models.txt
            aider --yes-always --no-check-update --model "$M" --map-tokens 8192 --read AGENTS.md --read config/rules.yaml --read db/schema.sql --message-file /tmp/review.txt $(cat /tmp/files.txt) > /tmp/rev.log 2>&1 || true
            grep -qiE "rate.?limit|NotFoundError|quota|RESOURCE_EXHAUSTED|is unavailable|overloaded" /tmp/rev.log || break
            sleep 40
          done
          mkdir -p docs/ai; tail -40 /tmp/rev.log > "docs/ai/review-$T.txt"
          ruff check . > /dev/null 2>&1 && L=pass || L=FAIL
          pytest -q > /dev/null 2>&1 && U=pass || U=FAIL
          printf "review %s\nlint %s\ntests %s\n" "$T" $L $U >> "docs/ai/report-$T.txt"
          git add -A && git commit -qm "AI review $T (lint $L, tests $U)" || true
          git push -f origin "ai/$T"
