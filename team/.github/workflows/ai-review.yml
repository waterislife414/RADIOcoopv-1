name: ai-review
# Push branch ai-review/<Tn>: a DIFFERENT model than the author attacks the diff on ai/<Tn>, fixes real problems, re-runs checks.
on:
  push:
    branches: ['ai-review/**']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BR: ${{ github.ref_name }}
        run: |
          . docs/ai/cfg.sh
          T="${BR#ai-review/}"
          git config user.name "ai-reviewer"; git config user.email "ai-bot@users.noreply.github.com"
          git checkout -B "ai/$T" "origin/ai/$T"
          pip install aider-chat && bash -c "${SETUP_CMD:-true}"
          git diff "origin/$WORK_BRANCH" --name-only -- $CODE_DIRS > /tmp/files.txt || true
          { cat AGENTS.md; echo; echo "You are the REVIEWER, not the author. Another AI made this change for task: $(grep -E "^$T " AI_PROMPT.md)"; echo "Attack it: wrong collection/field names, missing null checks, hooks rules, unused imports, broken styling, security rules, anything outside the task. Read the real code for every name it uses. Fix real problems with minimal edits; if nothing is wrong change nothing. End by listing each issue found and fixed."; } > /tmp/review.txt
          # Reviewer starts with the model chain reversed so it is not the author's model.
          for M in $(echo $MODELS | tr ' ' '\n' | tac); do
            echo "trying $M" >> /tmp/models.txt
            aider --yes-always --no-check-update --model "$M" --map-tokens 8192 $READ_ALWAYS --message-file /tmp/review.txt $(cat /tmp/files.txt) > /tmp/rev.log 2>&1 || true
            grep -qiE "$RATE_RE" /tmp/rev.log || break
            sleep 40
          done
          mkdir -p docs/ai; tail -40 /tmp/rev.log > "docs/ai/review-$T.txt"
          U=skip; [ -n "$UNIT_CMD" ] && { bash -c "$UNIT_CMD" > /dev/null 2>&1 && U=pass || U=FAIL; }
          { printf "review %s\nunit %s\n" "$T" "$U"; run_builds; } >> "docs/ai/report-$T.txt"
          git add -A && git commit -qm "AI review $T (unit $U)" || true
          git push -f origin "ai/$T"
