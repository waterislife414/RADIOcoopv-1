name: qa
# Push qa-run/<anything>: runs the app's QA click-through (ai-team.json "qa") on the work branch. Result: branch qa/result.
on:
  push:
    branches: ['qa-run/**']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Click-through
        run: |
          . docs/ai/cfg.sh; git checkout -q -B target "origin/$WORK_BRANCH"; . docs/ai/cfg.sh
          bash -c "${SETUP_CMD:-true}"
          pip install playwright && python -m playwright install --with-deps chromium
          bash -c "$QA_CMD" > /tmp/qa.txt 2>&1 || true
          cat /tmp/qa.txt
          git checkout -q -B qa/result; mkdir -p docs/ai; cp /tmp/qa.txt docs/ai/qa.txt
          git config user.name qa-bot; git config user.email qa-bot@users.noreply.github.com
          git add -f docs/ai/qa.txt; git commit -qm "QA result"; git push -f origin qa/result
