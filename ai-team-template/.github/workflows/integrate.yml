name: integrate
# Push branch integrate/<x>. Waits for running ai-task runs, then scores each worker branch alone and all together against the step 1 click-through.
on:
  push:
    branches: ['integrate/**']
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: { ref: step1-wip, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci && pip install playwright && python -m playwright install --with-deps chromium
      - name: Wait for workers
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in $(seq 1 30); do
            N=$(gh run list --workflow ai-task --status in_progress --json databaseId -q 'length'; )
            Q=$(gh run list --workflow ai-task --status queued --json databaseId -q 'length')
            [ "$N" = "0" ] && [ "$Q" = "0" ] && break
            sleep 60
          done
      - name: Score
        run: |
          OUT=/tmp/integrate.txt; : > $OUT
          score(){ bash tests/qa/run.sh 2>&1 | grep -E "^== " | head -1; }
          git config user.name integrate-bot; git config user.email integrate-bot@users.noreply.github.com
          git checkout -q -B base; echo "baseline (step1-wip): $(score)" >> $OUT
          for T in T7 T2 T5; do
            if ! git fetch -q origin ai/$T 2>/dev/null; then echo "$T: no branch" >> $OUT; continue; fi
            MB=$(git merge-base base origin/ai/$T)
            git diff $MB origin/ai/$T -- src > /tmp/$T.patch
            if [ ! -s /tmp/$T.patch ]; then echo "$T: no code changes" >> $OUT; continue; fi
            git checkout -q -B try base
            if git apply --3way /tmp/$T.patch 2>/dev/null; then echo "$T alone: $(score)  ($(git diff --stat | tail -1))" >> $OUT; else echo "$T: patch does not apply" >> $OUT; fi
            git reset -q --hard; git clean -fdq
          done
          git checkout -q -B all base
          for T in T7 T2 T5; do [ -s /tmp/$T.patch ] && git apply --3way /tmp/$T.patch 2>/dev/null || echo "$T: skipped in combined" >> $OUT; done
          echo "ALL TOGETHER: $(score)" >> $OUT
          bash tests/qa/run.sh 2>&1 | grep -E "^  FAIL" | cut -c1-260 >> $OUT || true
          npm run build > /dev/null 2>&1 && echo "build ok" >> $OUT || echo "build FAIL" >> $OUT
          mkdir -p docs/ai; cp $OUT docs/ai/integrate.txt
          git add -A; git commit -qm "integrated wave (candidate)" || true
          git push -f origin all:integrate-result
