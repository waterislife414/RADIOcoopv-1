<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><title>forms</title><meta name="robots" content="noindex" /></head>
<body>
<!-- Netlify Forms skeleton for the booking request (launch mode). Field names must match components/booking/launch.tsx. -->
<form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="booking" />
  <input type="hidden" name="subject" />
  <input name="bot-field" />
  <input type="text" name="name" />
  <input type="tel" name="phone" />
  <input type="email" name="email" />
  <input type="text" name="ref" />
  <input type="text" name="mode" />
  <input type="text" name="address" />
  <input type="text" name="location" />
  <input type="text" name="vehicle" />
  <input type="text" name="services" />
  <input type="text" name="when" />
  <input type="text" name="promo" />
  <textarea name="details"></textarea>
</form>
</body>
</html>
